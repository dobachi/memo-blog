# Pandoc
pandoc:
  # hexo-renderer-pandoc 0.5 は引数を一切付けない。
  # 0.3 がハードコードしていた既定値をここで明示する。
  # 落とすと全記事の引用符が curly になり、TOC も消える。
  args:
    - -f
    - markdown-smart
    - -t
    - html-smart
    - --mathjax
    - --toc
    - --template=template/simple_toc.html
